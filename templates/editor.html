
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編輯審查管理</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="container">
        <div class="page-header">
            <img src="/static/images/notebook.png" alt="筆記本" class="page-icon">
            <h1>編輯審查管理</h1>
        </div>
        <hr>

        <h2>待審查稿件清單</h2>

        <table>
            <thead>
                <tr>
                    <th>作者</th>
                    <th>類別</th>
                    <th>標題</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                {% for article in articles %}
                <tr>
                    <td>{{ article.username }}</td>
                    <td>{{ article.category }}</td>
                    <td>{{ article.title }}</td>
                    <td>
                        <a href="/editor/review/{{ article.id }}">查看</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <p><a href="/" class="back-link">← 返回首頁</a></p>
    </div>

</body>
</html>

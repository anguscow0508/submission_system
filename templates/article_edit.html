
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編輯投稿</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="container">
        <h1>編輯投稿</h1>
        <hr>

        <form action="/author/edit/{{ article.id }}" method="post">

            <div class="form-group">
                <label for="category">投稿類別</label>
                <input type="text"
                       id="category"
                       name="category"
                       value="{{ article.category }}"
                       required>
            </div>

            <div class="form-group">
                <label for="title">文章標題</label>
                <input type="text"
                       id="title"
                       name="title"
                       value="{{ article.title }}"
                       required>
            </div>

            <div class="form-group">
                <label for="content">文章內容</label>
                <textarea id="content"
                          name="content"
                          rows="10"
                          required>{{ article.content }}</textarea>
            </div>

            <button type="submit">儲存修改</button>

        </form>

        <p><a href="/author" class="back-link">← 返回投稿清單</a></p>
    </div>

</body>
</html>
